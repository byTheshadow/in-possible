<!-- index.html -->
<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <!-- 不禁用缩放：低视力用户需要系统级放大 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F0E8" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>in-possible 零极限</title>
    <script>
      // 在样式渲染之前，同步套用上次保存的主题和字号，避免先闪一下默认样式。
      // 真正的设置存在 IndexedDB 里，这里只是一份缓存，加载完成后会以数据库为准。
      try {
        var raw = localStorage.getItem('ip_a11y_cache');
        if (raw) {
          var s = JSON.parse(raw);
          var root = document.documentElement;
          if (s.theme === 'dark' || s.theme === 'light') root.setAttribute('data-theme', s.theme);
          if (typeof s.fontScale === 'number') root.style.setProperty('--font-scale', String(s.fontScale));
          if (s.largeButtons) root.setAttribute('data-large-buttons', 'true');
          if (s.oneHand) root.setAttribute('data-one-hand', 'true');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>零极限需要开启 JavaScript 才能使用。</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
